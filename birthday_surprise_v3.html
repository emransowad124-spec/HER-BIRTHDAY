<button onclick="showSurprise()">Open Your Surprise 🎁</button>

<div id="surprise">Mou, you are the brightest part of my life. I love you endlessly. 💖</div>

<footer>— From your love, Emran 💞</footer>

<script>
// typing effect
const text = "My love, today is all about celebrating you, your beauty, your heart, and the joy you bring to my life.";
let idx = 0;
function type() {
  if (idx < text.length) {
    document.getElementById("typing").innerHTML += text.charAt(idx);
    idx++;
    setTimeout(type, 55);
  }
}
type();

// confetti
function createConfetti() {
  for (let i=0; i<40; i++) {
    let c = document.createElement('div');
    c.className = "confetti";
    c.style.left = Math.random()*100 + "vw";
    c.style.animationDuration = (3 + Math.random()*3) + "s";
    c.style.backgroundColor = ["#ff4da6","#ff66c4","#ff99dd","#ffb3e6"][Math.floor(Math.random()*4)];
    document.body.appendChild(c);
  }
}
createConfetti();

// surprise
function showSurprise(){
  document.getElementById("surprise").style.display = "block";
}
</script>
